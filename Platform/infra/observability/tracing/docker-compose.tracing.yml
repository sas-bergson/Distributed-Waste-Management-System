# =============================================================================
# DWMS Distributed Tracing Infrastructure (Feature 5 IMP)
# =============================================================================
# Provides OpenTelemetry Collector + Jaeger All-in-One for distributed tracing
# across Gateway (Node.js/Fastify) and Backend services (Python/FastAPI).
#
# Ports exposed:
#   - 16686: Jaeger UI (http://localhost:16686)
#   - 4317:  OTLP gRPC receiver
#   - 4318:  OTLP HTTP receiver
# =============================================================================

networks:
  dwms-net:
    name: dwms-net
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Jaeger All-in-One: In-memory tracing storage, query engine, and UI
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: dwms-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268" # Collector HTTP intake
    networks:
      - dwms-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector: Central pipeline for trace ingestion and batching
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: dwms-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Collector internal metrics
    depends_on:
      jaeger:
        condition: service_healthy
    networks:
      - dwms-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:13133/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
