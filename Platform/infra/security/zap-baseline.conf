# OWASP ZAP Baseline DAST Configuration for DWMS API Gateway
# Target: API Gateway endpoints (http://localhost:8080 or http://gateway:8080)
# Purpose: Scan for missing security headers, CORS misconfigurations, open directories, sensitive info exposure

# Thresholds: FAIL on HIGH and MEDIUM alerts, WARN on LOW and INFO
fail_on_severity:
  - High
  - Medium

# Alert overrides (rule ID, threshold, action)
rules:
  # 10020: Anti-CSRF Tokens Check (APIs typically use Authorization header / JWT)
  10020:
    action: IGNORE
    comment: "API Gateway uses stateless Bearer JWTs, not session cookies"

  # 10038: Content Security Policy (CSP) Header Missing
  10038:
    action: WARN
    comment: "Enforced at reverse-proxy / CDN layer for web frontends"

  # 10035: Strict-Transport-Security Header
  10035:
    action: WARN
    comment: "Enforced at TLS termination ingress"

  # 10096: Timestamp Disclosure
  10096:
    action: IGNORE
    comment: "Timestamps are part of normal JSON API payloads for waste reports"

  # 40012: Cross Site Scripting (Reflected)
  40012:
    action: FAIL
    comment: "Must be caught and blocked"

  # 40018: SQL Injection
  40018:
    action: FAIL
    comment: "Must be caught and blocked"
