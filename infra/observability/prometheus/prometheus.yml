global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway
          objective: platform

  - job_name: locations
    metrics_path: /metrics
    static_configs:
      - targets: ["locations:8001"]
        labels:
          service: locations
          objective: obj1

  - job_name: map
    metrics_path: /metrics
    static_configs:
      - targets: ["map:8002"]
        labels:
          service: map
          objective: obj2

  - job_name: requests
    metrics_path: /metrics
    static_configs:
      - targets: ["requests:8003"]
        labels:
          service: requests
          objective: obj3

  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets: ["realtime:8004"]
        labels:
          service: realtime
          objective: obj3

  - job_name: notifications
    metrics_path: /metrics
    static_configs:
      - targets: ["notifications:8005"]
        labels:
          service: notifications
          objective: obj3
