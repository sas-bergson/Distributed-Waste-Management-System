name: Backup and recovery implementation

on:
  push:
    branches: [feat/chore/backup-dr]
  pull_request:
    paths:
      - infrastructure/backup/**
      - .github/workflows/backup-dr.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.11.13 mypy==1.15.0 pytest==8.3.5
      - run: ruff check infrastructure/backup && ruff format --check infrastructure/backup
      - run: mypy infrastructure/backup
      - run: pytest -q infrastructure/backup
      - run: python -m unittest discover -s infrastructure/backup -p 'test_*.py' -v
      - run: bash -n infrastructure/backup/scheduled-backup.sh
      - name: Start isolated PostGIS 16
        run: |
          docker run -d --name dwms-backup-ci -e POSTGRES_USER=dwms -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=dwms postgis/postgis:16-3.4
          for attempt in $(seq 1 60); do
            if docker exec dwms-backup-ci pg_isready -h 127.0.0.1 -U dwms -d dwms; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify database round trip
        shell: bash
        run: |
          set -euo pipefail
          docker exec dwms-backup-ci psql -U dwms -d dwms -v ON_ERROR_STOP=1 -c "CREATE TABLE recovery_probe (id integer PRIMARY KEY, location geometry(Point,4326)); INSERT INTO recovery_probe VALUES (1, ST_SetSRID(ST_Point(9.7,4.0),4326));"
          python infrastructure/backup/backup.py backup --container dwms-backup-ci --output /tmp/dwms-ci.dump
          python infrastructure/backup/backup.py restore --container dwms-backup-ci --archive /tmp/dwms-ci.dump --target-database dwms_restore_ci
          actual=$(docker exec dwms-backup-ci psql -U dwms -d dwms_restore_ci -Atc 'SELECT ST_AsText(location) FROM recovery_probe WHERE id=1')
          test "$actual" = 'POINT(9.7 4)'
      - name: Clean isolated database
        if: always()
        run: docker rm -f dwms-backup-ci || true
