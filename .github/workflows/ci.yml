name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Sanity, Secret & Syntax Gate
  # ---------------------------------------------------------------------------
  sanity-and-secrets:
    name: Sanity & Secrets Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no secrets or sensitive files committed
        run: |
          echo "Scanning for forbidden files (.env, *.key, *.pem, secrets/)..."
          FORBIDDEN_FILES=$(find . -type f \( -name ".env" -o -name ".env.local" -o -name "*.key" -o -name "*.pem" \) ! -name ".env.example" ! -path "*/.git/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Found forbidden sensitive file(s) committed:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden sensitive files detected."

      - name: Validate YAML syntax across repository
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install pyyaml
          python -c "
          import glob, sys, yaml
          error = False
          for f in glob.glob('**/*.y*ml', recursive=True):
              if '.git/' in f:
                  continue
              try:
                  with open(f, 'r') as fh:
                      yaml.safe_load(fh)
              except Exception as e:
                  print(f'YAML error in {f}: {e}')
                  error = True
          if error:
              sys.exit(1)
          print('All YAML files are syntactically valid.')
          "

  # ---------------------------------------------------------------------------
  # 2. Python Quality Gate (Ruff, Mypy, Pytest)
  # ---------------------------------------------------------------------------
  python-quality-gate:
    name: Python Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for Python source files
        id: check_python
        run: |
          PY_COUNT=$(find . -name "*.py" ! -path "*/.git/*" | wc -l)
          echo "Found $PY_COUNT Python files."
          echo "py_count=$PY_COUNT" >> $GITHUB_OUTPUT

      - name: Install Python quality tools
        if: steps.check_python.outputs.py_count > 0
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Ruff Lint & Format Checks
        if: steps.check_python.outputs.py_count > 0
        run: |
          echo "Running Ruff linter..."
          ruff check .
          echo "Running Ruff format check..."
          ruff format --check .

      - name: Run Mypy (Type Checking)
        if: steps.check_python.outputs.py_count > 0
        run: |
          echo "Running Mypy static type checker..."
          mypy --ignore-missing-imports .

      - name: Run Pytest
        if: steps.check_python.outputs.py_count > 0
        run: |
          echo "Running Python test suite..."
          pytest -v

  # ---------------------------------------------------------------------------
  # 3. Node / TypeScript Quality Gate (ESLint, Prettier, tsc, Vitest)
  # ---------------------------------------------------------------------------
  node-quality-gate:
    name: Node / TS Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Node / TS packages
        id: check_node
        run: |
          PKG_COUNT=$(find . -name "package.json" ! -path "*/node_modules/*" ! -path "*/.git/*" | wc -l)
          echo "Found $PKG_COUNT package.json files."
          echo "pkg_count=$PKG_COUNT" >> $GITHUB_OUTPUT

      - name: Install pnpm
        if: steps.check_node.outputs.pkg_count > 0
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20 LTS
        if: steps.check_node.outputs.pkg_count > 0
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & run checks across Node packages
        if: steps.check_node.outputs.pkg_count > 0
        run: |
          find . -name "package.json" ! -path "*/node_modules/*" ! -path "*/.git/*" -exec dirname {} \; | while read dir; do
            echo "Processing Node package in $dir..."
            (
              cd "$dir"
              pnpm install --frozen-lockfile || pnpm install
              if pnpm run | grep -q "lint"; then
                echo "Running lint in $dir..."
                pnpm run lint
              fi
              if pnpm run | grep -q "typecheck"; then
                echo "Running typecheck in $dir..."
                pnpm run typecheck
              fi
              if pnpm run | grep -q "test"; then
                echo "Running tests in $dir..."
                pnpm test
              fi
            )
          done

  # ---------------------------------------------------------------------------
  # 4. Docker Compose Scaffolding Gate
  # ---------------------------------------------------------------------------
  compose-gate:
    name: Docker Compose Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose definitions
        run: |
          COMPOSE_FILES=$(find . -maxdepth 4 \( -name "docker-compose*.yml" -o -name "compose*.yml" \) ! -path "*/.git/*")
          if [ -z "$COMPOSE_FILES" ]; then
            echo "No Docker Compose files found yet. Skipping validation."
          else
            echo "Found compose file(s):"
            echo "$COMPOSE_FILES"
            for file in $COMPOSE_FILES; do
              echo "Validating syntax of $file..."
              docker compose -f "$file" config > /dev/null
              echo "✓ $file is valid."
            done
          fi

  # ---------------------------------------------------------------------------
  # 5. Consolidated CI Completion Gate (Required for Branch Protection)
  # ---------------------------------------------------------------------------
  ci-all-green:
    name: All CI Quality Gates Passed
    needs:
      - sanity-and-secrets
      - python-quality-gate
      - node-quality-gate
      - compose-gate
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        run: |
          echo "=========================================="
          echo " All CI quality gates passed successfully! "
          echo "=========================================="
